name: Refresh Colab badge

on:
  push:
    branches: [main]
    paths:
      - MOSS_T4_Smoke.ipynb
      - MOSS_T4_ComfyUI.ipynb
      - .github/workflows/refresh-colab-badge.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-colab-badge
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Link to the latest notebook commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import re
          import time
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          api = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Cache-Control': 'no-cache',
          }

          def request(path, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(api + path, data=body, headers=headers,
                                           method='GET' if body is None else 'PUT')
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          readme = request('/contents/README.md?ref=main')
          original = base64.b64decode(readme['content']).decode('utf-8')
          updated = original
          for notebook in ('MOSS_T4_Smoke.ipynb', 'MOSS_T4_ComfyUI.ipynb'):
              revision = request(f'/commits?sha=main&path={notebook}&per_page=1'
                                 + f'&fresh={time.time_ns()}')[0]['sha']
              target = f'https://colab.research.google.com/github/{repo}/blob/{revision}/{notebook}'
              updated, count = re.subn(
                  r'https://colab\.research\.google\.com/github/' + re.escape(repo)
                  + r'/blob/[^/\s)]+/' + re.escape(notebook) + r'(?:\?[^\s)]*)?', target, updated)
              if count != 1:
                  raise RuntimeError(f'Expected one Colab badge for {notebook}, found {count}')
              print('Colab notebook:', target)
          if updated != original:
              request('/contents/README.md', {
                  'message': 'Update Colab badges to latest notebook commits',
                  'content': base64.b64encode(updated.encode('utf-8')).decode(),
                  'sha': readme['sha'], 'branch': 'main',
              })
          PY
